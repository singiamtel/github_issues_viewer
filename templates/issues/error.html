{% extends 'base.html' %}

{% block content %}
<div class="min-h-[50vh] flex items-center justify-center">
    <div class="max-w-md w-full bg-white shadow-lg rounded-lg p-8 text-center">
        <div class="text-red-500 mb-4">
            <i class="fas fa-exclamation-circle text-5xl"></i>
        </div>
        
        <h2 class="text-2xl font-bold text-gray-900 mb-4">Oops! Something went wrong</h2>
        
        <p class="text-gray-600 mb-6">
            {{ message }}
        </p>
        
        <div class="space-y-4">
            <a href="{% url 'select_repository' %}" class="block w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-md transition duration-200">
                <i class="fas fa-arrow-left mr-2"></i>
                Try Another Repository
            </a>
            
            <a href="{% url 'home' %}" class="block w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-md transition duration-200">
                <i class="fas fa-home mr-2"></i>
                Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
