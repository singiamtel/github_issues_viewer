<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A streamlined GitHub Issues viewer that helps you manage and track repository issues efficiently with a modern interface">
    <meta name="keywords" content="github, issues, repository, bug tracking, project management, github issues viewer">
    <title>GitHub Issues Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="/static/js/github-proxy.js"></script>
    <script>
        function disableLoginButtons() {
            const loginButtons = document.querySelectorAll('.github-login-btn');
            loginButtons.forEach(button => {
                button.disabled = true;
                button.classList.add('opacity-75', 'cursor-not-allowed');
                // Add loading spinner
                const icon = button.querySelector('i');
                if (icon) {
                    icon.className = 'fas fa-spinner fa-spin mr-2';
                }
                button.querySelector('span').textContent = 'Logging in...';
            });
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between h-16">
                <div class="flex">
                    <div class="flex-shrink-0 flex items-center">
                        <a href="{% url 'home' %}" class="text-xl font-bold text-gray-800">
                            <i class="fab fa-github mr-2"></i>
                            Issues Viewer
                        </a>
                    </div>
                </div>
                <div class="flex items-center">
                    {% if user.is_authenticated %}
                        <a href="{% url 'select_repository' %}" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">
                            Select Repository
                        </a>
                        <a href="{% url 'logout' %}" class="ml-4 bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-md text-sm font-medium">
                            Logout
                        </a>
                    {% else %}
                        <a href="{% url 'social:begin' 'github' %}" onclick="disableLoginButtons()" class="github-login-btn bg-gray-800 hover:bg-gray-700 text-white px-4 py-2 rounded-md text-sm font-medium">
                            <i class="fab fa-github mr-2"></i>
                            <span>Login with GitHub</span>
                        </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white shadow-lg mt-auto">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8">
            <p class="text-center text-gray-500 text-sm">
                GitHub Issues Viewer - View your repository issues in style
            </p>
        </div>
    </footer>
</body>
</html>
