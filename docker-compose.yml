services:
  web:
    build: .
    env_file:
      - .env
    volumes:
      - static_volume:/app/staticfiles
      - .:/app
    command: sh /app/entrypoint.sh

  caddy:
    image: caddy:2.7
    volumes:
      - static_volume:/app/staticfiles
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "8000:80"
    depends_on:
      - web

volumes:
  static_volume:
  caddy_data:
  caddy_config: