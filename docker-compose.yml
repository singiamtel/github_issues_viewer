version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - static_volume:/app/static
    command: gunicorn github_issues.wsgi:application --bind 0.0.0.0:8000 --workers 3

  caddy:
    image: caddy:2.7
    volumes:
      - static_volume:/app/static
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  static_volume:
  caddy_data:
  caddy_config: